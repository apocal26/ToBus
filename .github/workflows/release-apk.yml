name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Versione della release (es. v1.0.0)'
        required: true
        default: 'v1.0.0'
        type: string
      notes:
        description: 'Note di rilascio (opzionale)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$(printf '%s' "$INPUT_TAG" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          else
            TAG="$REF_NAME"
          fi
          if [ -z "$TAG" ]; then
            echo "Errore: il tag della versione non può essere vuoto." >&2
            exit 1
          fi
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager")"
          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build & Verify Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GITHUB_REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          VERSION_CLEAN="${RELEASE_TAG#v}"
          VERSION_CLEAN="${VERSION_CLEAN#V}"

          # Compute strictly monotonic versionCode from semantic version + run_number
          # e.g. v1.0 (run 5) -> 10000005, v1.1 (run 6) -> 10100006, v1.1.2 (run 7) -> 10102007
          VERSION_CODE="$(python3 - "$VERSION_CLEAN" "$RUN_NUMBER" <<'PY'
          import re, sys
          ver, run_num = sys.argv[1], int(sys.argv[2])
          nums = [int(x) for x in re.findall(r'\d+', ver)]
          major = nums[0] if len(nums) > 0 else 1
          minor = nums[1] if len(nums) > 1 else 0
          patch = nums[2] if len(nums) > 2 else 0
          code = major * 10_000_000 + minor * 100_000 + patch * 1_000 + (run_num % 1_000)
          print(code)
          PY
          )"
          echo "Resolved release version: versionName=${VERSION_CLEAN}, versionCode=${VERSION_CODE}"
          GRADLE_PROPS="-PtobusGithubRepo=${GITHUB_REPO} -PtobusVersionName=${VERSION_CLEAN} -PtobusVersionCode=${VERSION_CODE}"

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            SIGN_SOURCE="GitHub Secrets (KEYSTORE_BASE64)"
            echo "Compiling signed release APK using repository secrets..."
            printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "${RUNNER_TEMP}/release-upload-key.jks"
            # Auto-detect the keystore's private key alias and normalize the temporary CI copy to 'upload'
            # so any user-generated keystore works cleanly with app/build.gradle.kts signingConfigs.release
            DETECTED_ALIAS="$(keytool -list -keystore "${RUNNER_TEMP}/release-upload-key.jks" -storepass "$STORE_PASSWORD" \
              | awk -F',' '/PrivateKeyEntry|KeyEntry/ {print $1; exit}')"
            if [ -z "$DETECTED_ALIAS" ]; then
              echo "::error::Nessuna chiave privata trovata nel keystore fornito in KEYSTORE_BASE64 (controlla STORE_PASSWORD)."
              exit 1
            fi
            if [ "$DETECTED_ALIAS" != "upload" ]; then
              echo "Normalizing temporary keystore alias '${DETECTED_ALIAS}' -> 'upload'..."
              keytool -changealias -keystore "${RUNNER_TEMP}/release-upload-key.jks" \
                -storepass "$STORE_PASSWORD" -alias "$DETECTED_ALIAS" -destalias upload
            fi
            export KEYSTORE_PATH="${RUNNER_TEMP}/release-upload-key.jks"
            SIGN_PASS="$STORE_PASSWORD"
            SIGN_KEY_PASS="$KEY_PASSWORD"
          elif [ -f "debug.keystore.base64" ]; then
            SIGN_SOURCE="Repository debug.keystore.base64"
            echo "Compiling R8-optimized release APK signed with consistent project certificate..."
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > "${RUNNER_TEMP}/ci-release.keystore"
            DETECTED_ALIAS="$(keytool -list -keystore "${RUNNER_TEMP}/ci-release.keystore" -storepass android \
              | awk -F',' '/PrivateKeyEntry|KeyEntry/ {print $1; exit}')"
            if [ -n "$DETECTED_ALIAS" ] && [ "$DETECTED_ALIAS" != "upload" ]; then
              keytool -changealias -keystore "${RUNNER_TEMP}/ci-release.keystore" \
                -storepass android -alias "$DETECTED_ALIAS" -destalias upload
            fi
            export KEYSTORE_PATH="${RUNNER_TEMP}/ci-release.keystore"
            export STORE_PASSWORD="android"
            export KEY_PASSWORD="android"
            SIGN_PASS="android"
            SIGN_KEY_PASS="android"
          else
            echo "::error::Nessun keystore persistente trovato! Senza un certificato fisso Android rifiuta gli aggiornamenti con 'App non installata'. Configura i 3 GitHub Secrets del repository (KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD) oppure verifica la presenza del keystore persistente."
            exit 1
          fi

          CERT_SHA256="$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$SIGN_PASS" -alias upload \
            | awk '/SHA256:/ {print $2; exit}')"
          echo "Signing certificate SHA-256: ${CERT_SHA256}"

          gradle :app:assembleRelease $GRADLE_PROPS --no-daemon --stacktrace
          APK_SOURCE="app/build/outputs/apk/release/app-release.apk"

          BUILD_TOOLS_DIR="$(ls -d "${ANDROID_HOME}/build-tools/"* 2>/dev/null | sort -V | tail -n 1)"
          if [ -n "$BUILD_TOOLS_DIR" ] && [ -x "${BUILD_TOOLS_DIR}/apksigner" ]; then
            # Re-sign explicitly with v1+v2+v3 schemes after zipalign verification for maximum Android 7-16 compatibility
            "${BUILD_TOOLS_DIR}/zipalign" -c -P 16 4 "$APK_SOURCE"
            "${BUILD_TOOLS_DIR}/apksigner" sign \
              --ks "$KEYSTORE_PATH" \
              --ks-key-alias upload \
              --ks-pass "pass:${SIGN_PASS}" \
              --key-pass "pass:${SIGN_KEY_PASS}" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              "$APK_SOURCE"
            "${BUILD_TOOLS_DIR}/apksigner" verify --verbose --print-certs "$APK_SOURCE"
          fi

          mkdir -p release-artifacts
          APK_NAME="ToBus-${RELEASE_TAG}.apk"
          cp "$APK_SOURCE" "release-artifacts/${APK_NAME}"
          ls -lh "release-artifacts/${APK_NAME}"
          echo "APK_FILE=release-artifacts/${APK_NAME}" >> "$GITHUB_ENV"

          {
            echo "### Release APK Summary"
            echo "- **APK**: \`${APK_NAME}\`"
            echo "- **versionName**: \`${VERSION_CLEAN}\`"
            echo "- **versionCode**: \`${VERSION_CODE}\`"
            echo "- **Signing source**: ${SIGN_SOURCE}"
            echo "- **Certificate SHA-256**: \`${CERT_SHA256}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ToBus ${{ env.RELEASE_TAG }}
          body: ${{ inputs.notes }}
          generate_release_notes: ${{ inputs.notes == '' }}
          files: ${{ env.APK_FILE }}
